name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tools via mise
        uses: jdx/mise-action@v2

      - name: Add Android Build Tools to PATH
        run: echo "$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)" >> $GITHUB_PATH

      - name: Build Release APK
        run: mise run release

      - name: Zipalign APK
        run: zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/NopeRemote-${{ github.event.release.tag_name }}-aligned.apk
